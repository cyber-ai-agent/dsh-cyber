name: Patch PackageManager test store port

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
      - name: Add compensation method to the intentionally failing test store
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/package-runtime/tests/package-manager.test.ts')
          text = path.read_text(encoding='utf-8')
          old = """      rollbackPackageInstall: store.rollbackPackageInstall.bind(store),\n    }"""
          new = """      rollbackPackageInstall: store.rollbackPackageInstall.bind(store),\n      compensateActivatedPackageInstall: store.compensateActivatedPackageInstall.bind(store),\n    }"""
          if old not in text:
            raise SystemExit('failing PackageStorePort target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/patch-package-manager-test-port.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/package-runtime/tests/package-manager.test.ts .github/workflows/patch-package-manager-test-port.yml
          git commit -m "test: align failing package store with compensation port"
          git push origin HEAD:feat/creative-world-platform-v1
