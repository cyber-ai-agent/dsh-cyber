name: PR195 review source
on:
  push:
    branches: [codex/pr195-provider-attribution-20260908]
    paths: [.github/workflows/pr195-review-source.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify pinned inputs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin --prune
          test "$(git rev-parse origin/main)" = c8127dd1f91974617dbad6087119702c6e7132d7
          test "$(git merge-base HEAD origin/main)" = c8127dd1f91974617dbad6087119702c6e7132d7
          git fetch origin refs/pull/195/head:refs/heads/review-pr195
          test "$(git rev-parse review-pr195)" = a9d31f05e04c03a86162688a490b7e46a806b9fb
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          allowed = {'.github/workflows/pr195-review-source.yml', '.github/pr195-review.patch.xz.b64'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main', 'HEAD'], text=True).splitlines())
          assert changed == allowed, changed
          encoded = pathlib.Path('.github/pr195-review.patch.xz.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e0b9961532cc0ee9dbfe964454b4f6f50579d0bc7700be19687219e246364949'
          pathlib.Path('/tmp/pr195-review.patch').write_bytes(patch)
          print('Verified patch bytes:', len(patch))
          PY
      - name: Preserve contributor history and apply reviewed code
        run: |
          set -euo pipefail
          git config user.name cyber-ai-agent
          git config user.email 318511541+cyber-ai-agent@users.noreply.github.com
          git merge --no-ff review-pr195 -m "Merge contributor PR 195 for reviewed integration"
          git apply --check /tmp/pr195-review.patch
          git apply --index /tmp/pr195-review.patch
          git rm .github/pr195-review.patch.xz.b64
          git diff --cached --check
          git rm --cached .github/workflows/pr195-review-source.yml
          test "$(git write-tree)" = 3f410971915437b76782f724b8a1cbf5565836e0
          git restore --staged .github/workflows/pr195-review-source.yml
          git commit -m "fix(stats): guard legacy attribution and scope configured provider selection"
          git push origin HEAD:refs/heads/codex/pr195-provider-attribution-20260908
          git rev-parse HEAD
          git diff --stat origin/main HEAD
