name: Runtime review workspace
on:
  push:
    branches: [codex/runtime-reliability-20260907]
    paths: [.github/workflows/runtime-review-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify baseline and reviewed patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin --prune
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/codex/runtime-reliability-20260907)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = 59f45b5825b7c2485d050ee40cd3afc9bcb9df46
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          paths = ['.github/runtime-fix-0.b64', '.github/runtime-fix-1.b64']
          allowed = set(paths + ['.github/workflows/runtime-review-workspace.yml'])
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '59f45b5825b7c2485d050ee40cd3afc9bcb9df46', 'HEAD'], text=True).splitlines())
          assert changed == allowed, 'Unexpected concurrent branch changes'
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in paths)
          assert len(encoded) == 17216
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 52243
          assert hashlib.sha256(patch).hexdigest() == 'd980a9a8b982706d9c93725eb090b3fe2b185d07d7a9629f0d3ec65ca1c3f7f0'
          pathlib.Path('/tmp/runtime-reliability.patch').write_bytes(patch)
          PY
          git apply --check /tmp/runtime-reliability.patch
          git apply /tmp/runtime-reliability.patch
          git rm .github/runtime-fix-0.b64 .github/runtime-fix-1.b64
          git add packages e2e/runtime-reconnect.spec.ts playwright.smoke.config.ts
          git diff --cached --check
          git config user.name 'cyber-ai-agent'
          git config user.email '318511541+cyber-ai-agent@users.noreply.github.com'
          git commit -m 'fix(runtime): bound stalled streams and reconcile world panels with request ownership'
      - name: Fast-forward only this authorized development branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/codex/runtime-reliability-20260907 | cut -f1)" = "$EXPECTED_HEAD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git push origin HEAD:refs/heads/codex/runtime-reliability-20260907
          git rev-parse HEAD
