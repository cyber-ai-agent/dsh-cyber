name: Apply embodied runtime source fixups

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feat/embodied-world-runtime-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/embodied-world-runtime-v1
          fetch-depth: 0
      - name: Apply exact source transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          semantics = Path('packages/world-simulation/src/semantics.ts')
          text = semantics.read_text()
          old = "    sceneId: scene.id,\n    zones,"
          new = "    sceneId: scene.id,\n    navigation: structuredClone(scene.navigation),\n    zones,"
          if old in text:
              text = text.replace(old, new, 1)
              semantics.write_text(text)

          projector = Path('packages/world-runtime/src/projector.ts')
          text = projector.read_text()
          text = text.replace(
              "  JsonObject,\n",
              "  JsonObject,\n  JsonValue,\n",
              1,
          )
          text = text.replace(
              "const sceneNavigation = semanticsNavigation(semantics)",
              "const sceneNavigation = semantics.navigation ?? semanticsNavigation(semantics)",
              1,
          )
          text = text.replace(
              "    planId?: string\n    sessionId?: string\n",
              "    planId?: string | undefined\n    sessionId?: string | undefined\n",
              1,
          )
          old_compact = """function compactVisualState(value: Record<string, unknown>): JsonObject {
            const result: JsonObject = {}
            for (const [key, field] of Object.entries(value)) {
              if (field === undefined) continue
              if (typeof field === 'string' || typeof field === 'number' || typeof field === 'boolean' || field === null) {
                result[key] = field
              }
            }
            return result
          }
          """
          new_compact = """function compactVisualState(value: Record<string, unknown>): JsonObject {
            const result: JsonObject = {}
            for (const [key, field] of Object.entries(value)) {
              if (field !== undefined && isJsonValue(field)) result[key] = field
            }
            return result
          }

          function isJsonValue(value: unknown): value is JsonValue {
            if (value === null || typeof value === 'string' || typeof value === 'boolean') return true
            if (typeof value === 'number') return Number.isFinite(value)
            if (Array.isArray(value)) return value.every(isJsonValue)
            if (typeof value !== 'object') return false
            return Object.values(value as Record<string, unknown>).every(isJsonValue)
          }
          """
          if old_compact in text:
              text = text.replace(old_compact, new_compact, 1)
          projector.write_text(text)
          PY
      - name: Commit source fixups
        run: |
          if git diff --quiet; then
            echo "Source already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/world-simulation/src/semantics.ts packages/world-runtime/src/projector.ts
          git commit -m "fix: align embodied runtime source contracts"
          git push origin HEAD:feat/embodied-world-runtime-v1
