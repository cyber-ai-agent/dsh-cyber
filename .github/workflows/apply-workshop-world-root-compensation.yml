name: Apply Workshop world-root compensation

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
      - name: Clean managed world root after database rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/server/src/services/creative-workshop-service.ts')
          text = path.read_text(encoding='utf-8')
          old = """      if (createdWorldId !== undefined) {\n        try {\n          this.#store.rollbackWorldCreation(createdWorldId, 'creative-workshop-build-failed')\n        } catch (cause) {\n          compensationFailures.push(cause)\n        }\n      }"""
          new = """      if (createdWorldId !== undefined) {\n        try {\n          this.#store.rollbackWorldCreation(createdWorldId, 'creative-workshop-build-failed')\n        } catch (cause) {\n          compensationFailures.push(cause)\n        }\n        try {\n          await this.#worldRoots.remove(createdWorldId)\n        } catch (cause) {\n          compensationFailures.push(cause)\n        }\n      }"""
          if old not in text:
            raise SystemExit('Workshop world compensation target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/apply-workshop-world-root-compensation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/server/src/services/creative-workshop-service.ts .github/workflows/apply-workshop-world-root-compensation.yml
          git commit -m "fix: remove orphan world roots during Workshop compensation"
          git push origin HEAD:feat/creative-world-platform-v1
