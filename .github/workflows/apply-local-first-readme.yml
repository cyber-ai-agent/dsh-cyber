name: Apply local-first README

on:
  push:
    branches:
      - feat/creative-world-platform-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README local-first guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          anchor = '- **本地优先存储**：SQLite 保存工作区、世界、角色、会话索引、偏好、档案与授权；核心功能不依赖云端账户。\n'
          replacement = anchor + '- **本地创意工坊**：用户创建的世界、角色 Blueprint、具身语义和生成包保存在 `stateRoot/workshop`，应用更新不会覆盖；未来云端只作为可选同步副本。\n- **受信任 Skill Adapter**：角色模板只声明 Skill 请求，角色 revision 单独授权；外部动作通过宿主 Adapter 结构化执行并记录真实状态。\n'
          if anchor not in text:
              raise SystemExit('core capability anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_update = '“设置 → 更新”提供受控的底层 DSH 升级流程：候选版本先进入隔离 profile，依次通过精确版本验证、协议合同测试和两轮真实模型金丝雀，得到人工批准后才会备份本地数据库并写入活动运行时指针。更新在下次启动时生效，失败记录保留在 SQLite 中。'
          new_update = '“设置 → 更新”提供受控的底层 DSH 升级流程：候选版本先进入隔离 profile，依次通过精确版本验证、协议合同测试和两轮真实模型金丝雀，得到人工批准后先生成完整 `.dshbackup` 本地数据 Bundle，再写入活动运行时指针。更新在下次启动时生效，失败记录保留在 SQLite 中。'
          if old_update not in text:
              raise SystemExit('runtime update copy anchor not found')
          text = text.replace(old_update, new_update, 1)

          text = text.replace('pnpm dsh-cyber -- backup --data-dir ./data --output ./backup.sqlite', 'pnpm dsh-cyber -- backup --data-dir ./data --output ./backup.dshbackup', 1)

          old_rollback = '如果候选 DSH 导致 Web 服务无法启动，`runtime-rollback` 不依赖 Web UI，会先创建 SQLite 备份，再清除候选运行时指针并恢复项目内置版本。'
          new_rollback = '如果候选 DSH 导致 Web 服务无法启动，`runtime-rollback` 不依赖 Web UI，会先创建包含 SQLite、世界、资产、已安装包、创意工坊和 Skill 动作的完整本地 Bundle，再清除候选运行时指针并恢复项目内置版本。'
          if old_rollback not in text:
              raise SystemExit('rollback copy anchor not found')
          text = text.replace(old_rollback, new_rollback, 1)

          dirs = '- Windows：`%LOCALAPPDATA%\\DSH Cyber`\n- macOS / Linux：`~/.dsh-cyber`\n'
          update_section = '''- Windows：`%LOCALAPPDATA%\\DSH Cyber`\n- macOS / Linux：`~/.dsh-cyber`\n\n### 更新到最新版本（保留本地世界与创作数据）\n\nDSH Cyber 的程序目录与 `stateRoot` 分离。正常更新只替换源码、依赖和构建产物，不删除本地世界、角色、会话、Workshop 项目、Skill 动作或资产。推荐更新前先生成一次完整 Bundle：\n\n```bash\npnpm dsh-cyber -- backup\n\ngit fetch origin\ngit switch main\ngit pull --ff-only origin main\n\npnpm install --frozen-lockfile\npnpm build\npnpm dsh-cyber -- doctor\npnpm dsh-cyber -- web\n```\n\n开发分支用户把 `main` 替换为目标分支即可；如果使用自定义 `--data-dir`，更新后继续传入**同一个数据目录**。完整说明见 [`docs/operations/local-first-upgrades.md`](./docs/operations/local-first-upgrades.md)。不要通过删除 `~/.dsh-cyber`、`%LOCALAPPDATA%\\DSH Cyber`、`workshop/` 或 `worlds/` 来处理普通代码升级。\n'''
          if dirs not in text:
              raise SystemExit('data directory anchor not found')
          text = text.replace(dirs, update_section, 1)

          old_privacy = '- SQLite 是本地权威数据源；云同步是未来可选的加密副本，不替代本地所有权。'
          new_privacy = '- 本地 `stateRoot` 是当前权威数据源：SQLite、世界、Workshop、Skill 动作和资产共同组成用户本地状态；云同步是未来可选的加密副本，不替代本地所有权。'
          if old_privacy not in text:
              raise SystemExit('privacy anchor not found')
          text = text.replace(old_privacy, new_privacy, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-local-first-readme.yml
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document safe local-first update workflow"
          git push origin HEAD:feat/creative-world-platform-v1
