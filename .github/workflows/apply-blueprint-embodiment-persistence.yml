name: Apply Blueprint Embodiment persistence

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Apply portable Blueprint Embodiment contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} target missing')
              return text.replace(old, new, 1)

          # Core Character contract -------------------------------------------------
          path = Path('packages/contracts/src/index.ts')
          text = path.read_text(encoding='utf-8')
          if 'export const CYBER_SCHEMA_VERSION = 12 as const' in text:
              text = text.replace('export const CYBER_SCHEMA_VERSION = 12 as const', 'export const CYBER_SCHEMA_VERSION = 13 as const', 1)
          elif 'export const CYBER_SCHEMA_VERSION = 13 as const' not in text:
              raise SystemExit('unexpected schema version')

          export_line = "export type { EmbodimentPresetDescriptor, EmbodimentProfile, EmbodimentSocialPolicy } from './embodiment.js'"
          if export_line not in text:
              marker = "export type JsonObject = { [key: string]: JsonValue }\n"
              text = replace_once(text, marker, marker + '\n' + export_line + '\n', 'core embodiment export')

          if "embodiment?: import('./embodiment.js').EmbodimentProfile" not in text:
              marker = "  requestedSkills: string[]\n  requestedCapabilities: string[]\n  createdAt: IsoTimestamp"
              text = replace_once(
                  text,
                  marker,
                  "  requestedSkills: string[]\n  requestedCapabilities: string[]\n  embodiment?: import('./embodiment.js').EmbodimentProfile\n  createdAt: IsoTimestamp",
                  'EmployeeBlueprint embodiment field',
              )
          path.write_text(text, encoding='utf-8')

          # SQLite migration -------------------------------------------------------
          path = Path('packages/persistence/src/migrations.ts')
          text = path.read_text(encoding='utf-8')
          if "version: 13" not in text:
              marker = "  {\n    version: 12,\n    name: 'model-interaction-http-status',\n    sql: `\n      ALTER TABLE model_interaction_logs\n        ADD COLUMN http_status INTEGER CHECK (http_status BETWEEN 100 AND 599);\n    `,\n  },\n]"
              replacement = "  {\n    version: 12,\n    name: 'model-interaction-http-status',\n    sql: `\n      ALTER TABLE model_interaction_logs\n        ADD COLUMN http_status INTEGER CHECK (http_status BETWEEN 100 AND 599);\n    `,\n  },\n  {\n    version: 13,\n    name: 'portable-blueprint-embodiment',\n    sql: `\n      ALTER TABLE employee_blueprints ADD COLUMN embodiment_json TEXT;\n    `,\n  },\n]"
              text = replace_once(text, marker, replacement, 'migration v13')
          path.write_text(text, encoding='utf-8')

          # SQLite Blueprint persistence + recruitment inheritance ----------------
          path = Path('packages/persistence/src/sqlite-store.ts')
          text = path.read_text(encoding='utf-8')

          old = """        `INSERT INTO employee_blueprints (\n           id, version, world_template_id, display_name, role, summary, persona,\n           requested_skills_json, requested_capabilities_json, created_at\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        blueprint.id,\n        blueprint.version,\n        blueprint.worldTemplateId,\n        blueprint.displayName,\n        blueprint.role,\n        blueprint.summary,\n        blueprint.persona,\n        stringifyJson(blueprint.requestedSkills),\n        stringifyJson(blueprint.requestedCapabilities),\n        blueprint.createdAt,\n      )"""
          new = """        `INSERT INTO employee_blueprints (\n           id, version, world_template_id, display_name, role, summary, persona,\n           requested_skills_json, requested_capabilities_json, embodiment_json, created_at\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        blueprint.id,\n        blueprint.version,\n        blueprint.worldTemplateId,\n        blueprint.displayName,\n        blueprint.role,\n        blueprint.summary,\n        blueprint.persona,\n        stringifyJson(blueprint.requestedSkills),\n        stringifyJson(blueprint.requestedCapabilities),\n        blueprint.embodiment === undefined ? null : stringifyJson(blueprint.embodiment),\n        blueprint.createdAt,\n      )"""
          if 'embodiment_json, created_at' not in text:
              text = replace_once(text, old, new, 'saveBlueprint embodiment persistence')

          old_guard = """    if (blueprint.worldTemplateId !== world.templateId && world.templateId !== 'personal-world') {\n      throw new PersistenceError(\n        `Blueprint ${blueprint.id}@${blueprint.version} belongs to ${blueprint.worldTemplateId}, not ${world.templateId}`,\n      )\n    }"""
          new_guard = """    // A Blueprint with explicit semantic Embodiment is portable. Legacy\n    // Blueprints keep the historical template lock until upgraded.\n    if (\n      blueprint.embodiment === undefined\n      && blueprint.worldTemplateId !== world.templateId\n      && world.templateId !== 'personal-world'\n    ) {\n      throw new PersistenceError(\n        `Blueprint ${blueprint.id}@${blueprint.version} belongs to ${blueprint.worldTemplateId}, not ${world.templateId}`,\n      )\n    }"""
          if 'A Blueprint with explicit semantic Embodiment is portable' not in text:
              text = replace_once(text, old_guard, new_guard, 'portable recruitment guard')

          old_profile = """          `INSERT INTO employee_profile_revisions\n           (employee_id, revision, birthday, background, personality_traits_json,\n            appearance_json, reason, created_at)\n           VALUES (?, 1, NULL, ?, '[]', '{}', 'recruited', ?)`,\n        )\n        .run(employee.id, blueprint.summary, now)"""
          new_profile = """          `INSERT INTO employee_profile_revisions\n           (employee_id, revision, birthday, background, personality_traits_json,\n            appearance_json, reason, created_at)\n           VALUES (?, 1, NULL, ?, '[]', ?, 'recruited', ?)`,\n        )\n        .run(employee.id, blueprint.summary, stringifyJson(blueprintEmbodimentAppearance(blueprint)), now)"""
          if 'blueprintEmbodimentAppearance(blueprint)' not in text:
              text = replace_once(text, old_profile, new_profile, 'initial Blueprint embodiment inheritance')

          old_map = """function mapBlueprint(row: object): EmployeeBlueprint {\n  const value = row as Record<string, unknown>\n  return {\n    schemaVersion: 1,\n    id: String(value.id),\n    version: Number(value.version),\n    worldTemplateId: String(value.world_template_id),\n    displayName: String(value.display_name),\n    role: String(value.role),\n    summary: String(value.summary),\n    persona: String(value.persona),\n    requestedSkills: parseJson<string[]>(value.requested_skills_json),\n    requestedCapabilities: parseJson<string[]>(value.requested_capabilities_json),\n    createdAt: String(value.created_at),\n  }\n}"""
          new_map = """function mapBlueprint(row: object): EmployeeBlueprint {\n  const value = row as Record<string, unknown>\n  const blueprint: EmployeeBlueprint = {\n    schemaVersion: 1,\n    id: String(value.id),\n    version: Number(value.version),\n    worldTemplateId: String(value.world_template_id),\n    displayName: String(value.display_name),\n    role: String(value.role),\n    summary: String(value.summary),\n    persona: String(value.persona),\n    requestedSkills: parseJson<string[]>(value.requested_skills_json),\n    requestedCapabilities: parseJson<string[]>(value.requested_capabilities_json),\n    createdAt: String(value.created_at),\n  }\n  if (typeof value.embodiment_json === 'string') {\n    blueprint.embodiment = parseJson<NonNullable<EmployeeBlueprint['embodiment']>>(value.embodiment_json)\n  }\n  return blueprint\n}"""
          if 'blueprint.embodiment = parseJson' not in text:
              text = replace_once(text, old_map, new_map, 'mapBlueprint embodiment')

          old_equal = """    left.createdAt === right.createdAt &&\n    [...left.requestedSkills].sort().join('\\u0000') === [...right.requestedSkills].sort().join('\\u0000') &&\n    [...left.requestedCapabilities].sort().join('\\u0000') === [...right.requestedCapabilities].sort().join('\\u0000')"""
          new_equal = """    left.createdAt === right.createdAt &&\n    [...left.requestedSkills].sort().join('\\u0000') === [...right.requestedSkills].sort().join('\\u0000') &&\n    [...left.requestedCapabilities].sort().join('\\u0000') === [...right.requestedCapabilities].sort().join('\\u0000') &&\n    JSON.stringify(left.embodiment ?? null) === JSON.stringify(right.embodiment ?? null)"""
          if 'JSON.stringify(left.embodiment ?? null)' not in text:
              text = replace_once(text, old_equal, new_equal, 'Blueprint immutable embodiment equality')

          helper_marker = "function employeeBlueprintEquals(left: EmployeeBlueprint, right: EmployeeBlueprint): boolean {"
          if 'function blueprintEmbodimentAppearance' not in text:
              helper = """function blueprintEmbodimentAppearance(blueprint: EmployeeBlueprint): JsonObject {\n  const embodiment = blueprint.embodiment\n  if (embodiment === undefined) return {}\n  return {\n    worldBehaviorProfile: {\n      id: `${blueprint.id}@${blueprint.version}`,\n      roleTags: [...embodiment.roleTags],\n      preferredZoneTags: [...embodiment.preferredZoneTags],\n      preferredFacilityCapabilities: [...embodiment.preferredFacilityCapabilities],\n      allowedZoneTags: [...embodiment.allowedZoneTags],\n      homeSlotTags: [...embodiment.homeSlotTags],\n      ambientBehaviors: [...embodiment.ambientBehaviors],\n      socialPolicy: embodiment.socialPolicy ?? {\n        canInitiateConversation: false,\n        cooldownSeconds: 1_800,\n        maxDailyConversations: 0,\n      },\n    },\n    ...(embodiment.actorRigId === undefined ? {} : { actorRigId: embodiment.actorRigId }),\n  }\n}\n\n"""
              if helper_marker not in text:
                  raise SystemExit('Blueprint equality marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          path.write_text(text, encoding='utf-8')

          # Remove duplicated server-side inheritance: persistence is authoritative.
          path = Path('packages/server/src/routes/world-routes.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import type { JsonObject } from '@dsh-cyber/contracts'\n", '')
          text = text.replace("import { embodimentToBehaviorJson } from '../embodiment-profile.js'\n", '')
          pattern = re.compile(r"\n    if \(liveBlueprint\?\.embodiment !== undefined\) \{.*?\n    \}\n    await conversationHub\.ensureDirectSessions", re.S)
          text, count = pattern.subn("\n    await conversationHub.ensureDirectSessions", text, count=1)
          if count != 1 and 'liveBlueprint?.embodiment !== undefined' in text:
              raise SystemExit('world-routes embodiment inheritance block not removed')
          path.write_text(text, encoding='utf-8')

          path = Path('packages/server/src/services/creative-workshop-service.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('CyberPackageManifest, EmployeeBlueprint, JsonObject, PackagePermissionPreview', 'CyberPackageManifest, EmployeeBlueprint, PackagePermissionPreview')
          text = text.replace("import { embodimentToBehaviorJson, parseEmbodimentProfile } from '../embodiment-profile.js'", "import { parseEmbodimentProfile } from '../embodiment-profile.js'")
          pattern = re.compile(r"\n        const currentProfile = this\.#store\.getEmployeeProfile\(character\.id\).*?\n        \}\)\n", re.S)
          text, count = pattern.subn('\n', text, count=1)
          if count != 1 and 'creative-workshop-embodiment' in text:
              raise SystemExit('Workshop duplicate embodiment profile block not removed')
          path.write_text(text, encoding='utf-8')

          path = Path('packages/server/src/embodiment-profile.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import type { EmbodimentProfile } from '@dsh-cyber/contracts/creative-platform'", "import type { EmbodimentProfile } from '@dsh-cyber/contracts'")
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Commit verified migration and remove one-shot workflow
        run: |
          rm .github/workflows/apply-blueprint-embodiment-persistence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/index.ts packages/persistence/src/migrations.ts packages/persistence/src/sqlite-store.ts packages/server/src/routes/world-routes.ts packages/server/src/services/creative-workshop-service.ts packages/server/src/embodiment-profile.ts .github/workflows/apply-blueprint-embodiment-persistence.yml
          git commit -m "refactor: persist portable Blueprint Embodiment"
          git push origin HEAD:feat/creative-world-platform-v1
