name: Avatar Pack Handoff

on:
  pull_request:
    paths:
      - '.github/workflows/avatar-pack-handoff.yml'
      - 'scripts/build-official-avatar-base-pack*.mjs'
      - 'packages/web/scripts/verify-official-avatar-base-pack-runtime.mjs'
      - 'packages/web/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/official-avatar-pack-delivery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify official avatar pack
        run: pnpm avatar:build-official && pnpm avatar:verify-official
      - name: Upload verified handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-avatar-base-v1-handoff
          path: marketplace/plugins/official-avatar-base-v1
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified pack to delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add marketplace/plugins/official-avatar-base-v1
          if git diff --cached --quiet; then
            echo 'Verified avatar pack already matches the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: embed verified official avatar base pack'
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin "HEAD:${HEAD_REF}"
