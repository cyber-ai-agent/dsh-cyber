name: Avatar Pack Handoff

on:
  pull_request:
    paths:
      - '.github/workflows/avatar-pack-handoff.yml'
      - 'scripts/build-official-avatar-base-pack*.mjs'
      - 'packages/web/scripts/verify-official-avatar-base-pack-runtime.mjs'
      - 'packages/web/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify official avatar pack
        run: pnpm avatar:build-official && pnpm avatar:verify-official
      - name: Upload verified handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-avatar-base-v1-handoff
          path: marketplace/plugins/official-avatar-base-v1
          if-no-files-found: error
          retention-days: 1
