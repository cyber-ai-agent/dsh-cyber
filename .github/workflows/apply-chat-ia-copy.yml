name: Apply chat information architecture copy

on:
  push:
    branches:
      - feat/creative-world-platform-v1

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align chat copy with conversation-only navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/web/src/components/ChatWorkbench.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '从左侧通讯录选择一名${experience.personLabel}，或创建群聊': '从左侧会话列表进入私聊，或创建群聊',
            "'选择联系人开始互动'": "'选择会话开始互动'",
            "'角色像通讯录联系人一样存在：单击私聊，也可以创建多人群聊。'": "'左侧只保留会话：每个角色固定一个私聊，也可以创建多人群聊；角色新增与管理统一在右侧档案。'",
            "'先从左侧选择联系人，或输入 @角色名'": "'先从左侧选择会话，或输入 @角色名'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'copy anchor not found: {old}')
              text = text.replace(old, new, 1)
          button = "            {employees.length === 0 ? <button className=\"primary-button\" type=\"button\" onClick={onRecruit}>{experience.kind === 'tavern' ? '邀请第一张角色卡' : `添加第一名${experience.personLabel}`}</button> : null}\n"
          if button not in text:
              raise SystemExit('empty-state recruitment button anchor not found')
          text = text.replace(button, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-chat-ia-copy.yml
          git add packages/web/src/components/ChatWorkbench.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: align chat with conversation-only navigation"
          git push origin HEAD:feat/creative-world-platform-v1
