name: Fix peer projector duplicate fields

on:
  push:
    branches:
      - feat/npc-collaboration-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[peer-projector-deduped]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-collaboration-v1
          fetch-depth: 0
      - name: Collapse duplicated peerConversation properties
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/world-runtime/src/projector.ts')
          text = path.read_text()
          line = "        peerConversation: event.payload['peerConversation'] === true,\n"
          pattern = re.escape(line) + r'(?:' + re.escape(line) + r')+'
          fixed, count = re.subn(pattern, line, text)
          if count == 0:
              print('No duplicate peerConversation fields found')
          path.write_text(fixed)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Projector already deduplicated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/world-runtime/src/projector.ts
          git commit -m "fix: deduplicate peer meeting visual state [peer-projector-deduped]"
          git push origin HEAD:feat/npc-collaboration-v1
