name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: required
    runs-on: ubuntu-latest
    # Keep the protected PR gate short enough for rapid pre-alpha iteration.
    # A bounded deterministic browser smoke runs here; Full E2E keeps the broad suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Verify immutable workflow action pins
        run: node scripts/check-workflow-action-pins.mjs
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Migration replay and schema contracts
        run: pnpm test:migration && pnpm test:schema
      - name: Install browser for core smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Core browser smoke
        run: pnpm exec playwright test --config playwright.smoke.config.ts
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-browser-smoke
          path: .private/playwright-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # The status can only be written to a commit inside this repository.
      # For fork pull requests the head sha lives in the contributor's fork,
      # where GITHUB_TOKEN has no write access (403), so skip instead of failing.
      - name: Publish protected branch status
        if: >-
          ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"success","context":"CI / required","description":"typecheck, unit/integration, migration, schema and browser smoke passed"}'
