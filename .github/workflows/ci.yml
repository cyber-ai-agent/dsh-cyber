name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Verify immutable workflow action pins
        run: node scripts/check-workflow-action-pins.mjs
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Migration replay and schema contracts
        run: pnpm test:migration && pnpm test:schema
      - name: Install Chromium for required smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Required smoke E2E
        run: pnpm test:smoke
      # Build the real pinned CC0 source after smoke so the generated Marketplace
      # package cannot change normal unit/E2E discovery. This is intentionally a
      # networked authoring check, not a runtime dependency: the command verifies
      # exact Git blob ids, emits a local package, then parses that exact VRM with
      # the same Three/VRMLoaderPlugin path used by the product.
      - name: Verify official CC0 avatar pack build
        run: pnpm avatar:build-official && pnpm avatar:verify-official
      # Short-lived delivery evidence. The follow-up delivery change will either
      # embed this exact verified package in release/source artifacts or remove
      # this temporary handoff once the binary is committed reproducibly.
      - name: Upload verified official avatar pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-avatar-base-v1
          path: marketplace/plugins/official-avatar-base-v1
          if-no-files-found: error
          retention-days: 1
      # The status can only be written to a commit inside this repository.
      # For fork pull requests the head sha lives in the contributor's fork,
      # where GITHUB_TOKEN has no write access (403), so skip instead of failing.
      - name: Publish protected branch status
        if: >-
          ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"success","context":"CI / required","description":"typecheck and unit/integration tests passed"}'
