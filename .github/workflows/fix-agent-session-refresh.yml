name: Apply Agent session refresh once

on:
  push:
    branches:
      - feat/npc-collaboration-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-collaboration-v1
          fetch-depth: 0
      - name: Refresh persisted character state and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/orchestration/src/conversation-orchestrator.ts')
          text = path.read_text()
          marker = """  ): Promise<AgentReply> {
            const revision = this.#store.getEmployeeRevision(employee.id, employee.currentRevision)
          """
          replacement = """  ): Promise<AgentReply> {
            employee = this.#requireEmployeeInWorld(employee.id, session.workspaceId, session.worldId)
            const revision = this.#store.getEmployeeRevision(employee.id, employee.currentRevision)
          """
          if marker in text:
              path.write_text(text.replace(marker, replacement, 1))
          elif 'employee = this.#requireEmployeeInWorld(employee.id, session.workspaceId, session.worldId)' not in text:
              raise SystemExit('Agent turn refresh anchor not found')
          PY
          git rm .github/workflows/fix-agent-session-refresh.yml
      - name: Commit source fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orchestration/src/conversation-orchestrator.ts
          git commit -m "fix: refresh persisted Agent sessions between collaboration turns"
          git push origin HEAD:feat/npc-collaboration-v1
