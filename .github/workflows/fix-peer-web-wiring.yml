name: Fix peer web wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'feat/npc-collaboration-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-collaboration-v1
          fetch-depth: 0
      - name: Patch exact App callback and peer title
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('packages/web/src/App.tsx')
          text = app.read_text()
          if 'onStartGroup={(employeeIds, session) =>' not in text:
              start = text.index('                  onStartGroup={(employeeIds) => {')
              end = text.index('                  onRecruit={() => void openRecruitment()}', start)
              replacement = """                  onStartGroup={(employeeIds, session) => {
                    const selected = employees.filter((employee) => employeeIds.includes(employee.id))
                    if (selected.length < 2) return
                    if (session !== undefined) {
                      setSessions((current) => [session, ...current.filter((item) => item.id !== session.id)])
                      setSessionParticipants((current) => ({ ...current, [session.id]: employeeIds }))
                      setActiveSessionId(session.id)
                      setConversationIntent(undefined)
                      setSelectedEmployeeId(employeeIds[0])
                      setMessages([])
                      clearLiveTurns()
                      setAppMode('workbench')
                      setDockCollapsed(false)
                      setDockTab('world')
                      return
                    }
                    createGroupIntent({ employeeIds: selected.map((employee) => employee.id), title: selected.map((employee) => employee.displayName).join('、') })
                  }}
          """
              text = text[:start] + replacement + text[end:]
          app.write_text(text)

          route = Path('packages/server/src/routes/conversation-routes.ts')
          text = route.read_text()
          if 'const peerTitle = optionalString(body.title)' not in text:
              marker = '    const result = await peerCollaboration.run({'
              index = text.index(marker)
              text = text[:index] + '    const peerTitle = optionalString(body.title)\n' + text[index:]
          route.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Peer web wiring already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/App.tsx packages/server/src/routes/conversation-routes.ts
          git commit -m "fix: wire peer sessions into the active workbench [peer-web-fixed]"
          git push origin HEAD:feat/npc-collaboration-v1
