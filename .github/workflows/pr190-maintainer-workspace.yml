name: PR190 maintainer workspace
on:
  push:
    branches: [codex/pr190-model-stats-fixes-20260907]
    paths: [.github/workflows/pr190-maintainer-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cyber-ai-agent/dsh-cyber' && github.ref == 'refs/heads/codex/pr190-model-stats-fixes-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact contribution and patch, then remove transfer files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin --prune
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/codex/pr190-model-stats-fixes-20260907)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = 7d6fa682214aad98aa1a4c7e38e6438c6547e3da
          git merge-base --is-ancestor d723728c7322f2a6170b1c8738203ead1aea6b04 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          paths = [f'.github/pr190-fix-{i}.b64' for i in range(4)]
          allowed = set(paths + ['.github/workflows/pr190-maintainer-workspace.yml'])
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'a4e2bdd3929c40b8ee8bd98b5cc8a1cd81494d07', 'HEAD'], text=True).splitlines())
          assert changed == allowed, f'Unexpected concurrent changes: {changed ^ allowed}'
          encoded = ''.join(pathlib.Path(p).read_text().strip() for p in paths)
          assert len(encoded) == 31704
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 97303
          assert hashlib.sha256(patch).hexdigest() == '338c359a10150f44f0d79c2425cb1e3527826a8235e9bf14a755120e44e1894a'
          pathlib.Path('/tmp/pr190-maintainer.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/pr190-maintainer.patch
          git apply --unidiff-zero /tmp/pr190-maintainer.patch
          git rm .github/pr190-fix-{0,1,2,3}.b64 .github/workflows/pr190-maintainer-workspace.yml
          git add --all
          git diff --cached --check
          git config user.name 'cyber-ai-agent'
          git config user.email '318511541+cyber-ai-agent@users.noreply.github.com'
          git commit -m 'fix(model-stats): correct attribution and metrics, race-safe filters, and v49 telemetry migration'
          git diff --stat a4e2bdd3929c40b8ee8bd98b5cc8a1cd81494d07 HEAD
      - name: Fast-forward only the authorized repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/codex/pr190-model-stats-fixes-20260907 | cut -f1)" = "$EXPECTED_HEAD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git push origin HEAD:refs/heads/codex/pr190-model-stats-fixes-20260907
          git rev-parse HEAD
