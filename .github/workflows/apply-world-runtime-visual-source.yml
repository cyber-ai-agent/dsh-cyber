name: apply-world-runtime-visual-source

on:
  push:
    branches: [fix/world-experience-stabilization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-experience-stabilization
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Apply and verify runtime visual source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/apply-world-runtime-visual-source.mjs
          pnpm install --frozen-lockfile
          pnpm typecheck
          git diff --check
          git add packages/server/src/world-runtime-service.ts packages/web/src/App.tsx packages/web/src/components/SettingsDialog.tsx
          git commit -m "fix: unify world visual and model routing sources"
          rm scripts/apply-world-runtime-visual-source.mjs .github/workflows/apply-world-runtime-visual-source.yml
          git add -A
          git commit -m "chore: remove runtime visual bootstrap"
          git push origin HEAD:fix/world-experience-stabilization
