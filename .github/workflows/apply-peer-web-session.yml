name: Apply peer collaboration web session wiring

on:
  push:
    branches:
      - feat/npc-collaboration-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[peer-web-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-collaboration-v1
          fetch-depth: 0
      - name: Patch App and route exact optional values
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('packages/web/src/App.tsx')
          text = app.read_text()
          old = """                  onStartGroup={(employeeIds) => {
                    const selected = employees.filter((employee) => employeeIds.includes(employee.id))
                    if (selected.length < 2) return
                    createGroupIntent({ employeeIds: selected.map((employee) => employee.id), title: selected.map((employee) => employee.displayName).join('、') })
                  }}
          """
          new = """                  onStartGroup={(employeeIds, session) => {
                    const selected = employees.filter((employee) => employeeIds.includes(employee.id))
                    if (selected.length < 2) return
                    if (session !== undefined) {
                      setSessions((current) => [session, ...current.filter((item) => item.id !== session.id)])
                      setSessionParticipants((current) => ({ ...current, [session.id]: employeeIds }))
                      setActiveSessionId(session.id)
                      setConversationIntent(undefined)
                      setSelectedEmployeeId(employeeIds[0])
                      setMessages([])
                      clearLiveTurns()
                      setAppMode('workbench')
                      setDockCollapsed(false)
                      setDockTab('world')
                      return
                    }
                    createGroupIntent({ employeeIds: selected.map((employee) => employee.id), title: selected.map((employee) => employee.displayName).join('、') })
                  }}
          """
          if old in text:
              text = text.replace(old, new, 1)
          app.write_text(text)

          route = Path('packages/server/src/routes/conversation-routes.ts')
          text = route.read_text()
          old = """    const result = await peerCollaboration.run({
              workspaceId: world.workspaceId,
          """
          if old in text and "    const peerTitle = optionalString(body.title)\n" not in text:
              text = text.replace(old, "    const peerTitle = optionalString(body.title)\n" + old, 1)
          text = text.replace(
              "      ...(optionalString(body.title) === undefined ? {} : { title: optionalString(body.title) }),\n",
              "      ...(peerTitle === undefined ? {} : { title: peerTitle }),\n",
              1,
          )
          route.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Peer web session already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/App.tsx packages/server/src/routes/conversation-routes.ts
          git commit -m "feat: open persisted NPC collaboration sessions in the workbench [peer-web-applied]"
          git push origin HEAD:feat/npc-collaboration-v1
