name: Apply final E2E fixes

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - name: Align E2E with canonical conversation ordering
        shell: python
        run: |
          from pathlib import Path

          workbench = Path('e2e/workbench.spec.ts')
          text = workbench.read_text(encoding='utf-8')
          old = "await page.getByRole('region', { name: '当前世界的会话' }).getByRole('button').first().click()\n  await expect(page.getByText('我先建立性能基线。').first()).toBeVisible()"
          new = "await page.getByRole('button', { name: '与阿帆私聊' }).click()\n  await expect(page.getByText('我先建立性能基线。').first()).toBeVisible()"
          if old not in text:
              raise SystemExit('workbench target not found')
          workbench.write_text(text.replace(old, new, 1), encoding='utf-8')

          stabilization = Path('e2e/world-experience-stabilization.spec.ts')
          text = stabilization.read_text(encoding='utf-8')
          old = "await expect(dialog.getByText('当前世界已有 1 名')).toBeVisible()"
          new = "await expect(dialog.getByText('当前世界已有 1 名', { exact: true })).toBeVisible()"
          if old not in text:
              raise SystemExit('stabilization target not found')
          stabilization.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-final-e2e-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/workbench.spec.ts e2e/world-experience-stabilization.spec.ts
          git commit -m "test: align e2e with pinned canonical conversations"
          git push origin HEAD:feat/creative-world-platform-v1
