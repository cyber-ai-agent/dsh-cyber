name: PR Full E2E Gate

# Temporary merge gate for Creative Platform V1.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-full-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium:
    name: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
