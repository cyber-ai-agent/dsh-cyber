name: Trace directory workspace

on:
  push:
    branches: [codex/trace-details-world-directory-20260907]
    paths: [.github/workflows/trace-directory-workspace.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export pinned test dependencies only
        run: |
          mkdir -p .offline-tools
          cp "$(command -v node)" .offline-tools/node
          cp -a "$(dirname "$(readlink -f "$(command -v pnpm)")")/.." .offline-tools/pnpm
          tar -czf dependencies.tar.gz node_modules packages/*/node_modules .offline-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-directory-dependencies
          path: dependencies.tar.gz
          retention-days: 1
