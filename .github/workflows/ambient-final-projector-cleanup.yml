name: Final ambient projector cleanup

on:
  push:
    branches:
      - feat/role-aware-ambient-life

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/role-aware-ambient-life
          fetch-depth: 0
      - name: Remove retired social presentation state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/world-runtime/src/projector.ts')
          text = path.read_text()
          text = text.replace("    delete entity.visualState['ambientTargetCharacterId']\n", '')
          text = text.replace("    ambientTargetCharacterId: textValue(event.payload, 'targetCharacterId'),\n", '')
          text = text.replace(
              "    case 'consult-colleague':\n      return { activity: 'meeting', label: '前往进行一次岗位沟通' }\n",
              '',
          )
          text = text.replace(
              "        source: 'ambient',\n        planId: textValue(event.payload, 'planId'),\n",
              "        source: 'ambient',\n",
              1,
          )
          path.write_text(text)
          PY
          git rm .github/workflows/ambient-final-projector-cleanup.yml
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/world-runtime/src/projector.ts
          git commit -m "refactor: remove retired ambient social presentation"
          git push origin HEAD:feat/role-aware-ambient-life
