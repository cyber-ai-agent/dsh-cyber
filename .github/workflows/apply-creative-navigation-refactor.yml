name: Apply creative navigation refactor

on:
  push:
    branches:
      - feat/creative-world-platform-v1

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch App composition root
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/web/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = "import { ChatWorkbench } from './components/ChatWorkbench.js'\n"
          new_import = old_import + "import { CreativeWorkshopLauncher } from './components/CreativeWorkshopLauncher.js'\n"
          if old_import not in text:
              raise SystemExit('ChatWorkbench import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_market = '''          <button type="button" onClick={() => void openPackageMarket('theme')}><Buildings size={16} />主题市场</button>\n          <button type="button" onClick={() => void openPackageMarket('plugin')}><Cube size={16} />插件市场</button>\n          <button type="button" onClick={() => void openPackageMarket('talent')}><Storefront size={16} />角色市场</button>'''
          new_market = '''          <CreativeWorkshopLauncher workspaceId={workspace.id} onCreated={() => window.location.reload()} />\n          <button type="button" onClick={() => void openPackageMarket(packageMarketKind)}><Storefront size={16} />市场</button>'''
          if old_market not in text:
              raise SystemExit('topbar market anchor not found')
          text = text.replace(old_market, new_market, 1)

          old_artifact = '''            onOpenArtifact={() => { setAppMode('workbench'); setDockCollapsed(false); setDockTab('preview') }}\n            onRecruit={() => void openRecruitment()}'''
          new_artifact = '''            onOpenArtifact={() => { setAppMode('world'); setDockCollapsed(false); setDockTab('world') }}\n            onRecruit={() => { setSelectedEmployeeId(undefined); setDockCollapsed(false); setDockTab('dossier') }}'''
          if old_artifact not in text:
              raise SystemExit('chat workbench anchor not found')
          text = text.replace(old_artifact, new_artifact, 1)

          old_runtime_recruit = '''                  onRecruit={() => void openRecruitment()}\n                />'''
          if old_runtime_recruit not in text:
              raise SystemExit('WorldRuntimeDock recruitment anchor not found')
          text = text.replace(old_runtime_recruit, '''                />''', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-creative-navigation-refactor.yml
          git add packages/web/src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: unify topbar market and workshop navigation"
          git push origin HEAD:feat/creative-world-platform-v1
