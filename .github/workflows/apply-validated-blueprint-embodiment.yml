name: Apply Validated Blueprint Embodiment

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Apply validated patch
        shell: bash
        run: |
          git show 4220deb599bdc7077b08a1e7829f47243d0bf7cb:packages/persistence/src/migrations.ts > packages/persistence/src/migrations.ts
          git show 4220deb599bdc7077b08a1e7829f47243d0bf7cb:packages/persistence/src/sqlite-store.ts > packages/persistence/src/sqlite-store.ts

          python - <<'PY'
          from pathlib import Path
          import re

          migrations = Path('packages/persistence/src/migrations.ts')
          text = migrations.read_text(encoding='utf-8')
          needle = """  {\n    version: 12,\n    name: 'model-interaction-http-status',\n    sql: `\n      ALTER TABLE model_interaction_logs\n        ADD COLUMN http_status INTEGER CHECK (http_status BETWEEN 100 AND 599);\n    `,\n  },\n]"""
          replacement = """  {\n    version: 12,\n    name: 'model-interaction-http-status',\n    sql: `\n      ALTER TABLE model_interaction_logs\n        ADD COLUMN http_status INTEGER CHECK (http_status BETWEEN 100 AND 599);\n    `,\n  },\n  {\n    version: 13,\n    name: 'portable-blueprint-embodiment',\n    sql: `\n      ALTER TABLE employee_blueprints ADD COLUMN embodiment_json TEXT;\n    `,\n  },\n]"""
          if needle not in text:
            raise SystemExit('migration v12 tail not found')
          migrations.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          store = Path('packages/persistence/src/sqlite-store.ts')
          text = store.read_text(encoding='utf-8')
          old_insert = """        `INSERT INTO employee_blueprints (\n           id, version, world_template_id, display_name, role, summary, persona,\n           requested_skills_json, requested_capabilities_json, created_at\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        blueprint.id,\n        blueprint.version,\n        blueprint.worldTemplateId,\n        blueprint.displayName,\n        blueprint.role,\n        blueprint.summary,\n        blueprint.persona,\n        stringifyJson(blueprint.requestedSkills),\n        stringifyJson(blueprint.requestedCapabilities),\n        blueprint.createdAt,\n      )"""
          new_insert = """        `INSERT INTO employee_blueprints (\n           id, version, world_template_id, display_name, role, summary, persona,\n           requested_skills_json, requested_capabilities_json, embodiment_json, created_at\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        blueprint.id,\n        blueprint.version,\n        blueprint.worldTemplateId,\n        blueprint.displayName,\n        blueprint.role,\n        blueprint.summary,\n        blueprint.persona,\n        stringifyJson(blueprint.requestedSkills),\n        stringifyJson(blueprint.requestedCapabilities),\n        blueprint.embodiment === undefined ? null : stringifyJson(blueprint.embodiment as unknown as JsonValue),\n        blueprint.createdAt,\n      )"""
          if old_insert not in text:
            raise SystemExit('saveBlueprint insert target not found')
          text = text.replace(old_insert, new_insert, 1)

          guard = re.compile(
              r"    if \(blueprint\.worldTemplateId !== world\.templateId && world\.templateId !== 'personal-world'\) \{\n"
              r"      throw new PersistenceError\(\n"
              r"        `Blueprint \$\{blueprint\.id\}@\$\{blueprint\.version\} belongs to \$\{blueprint\.worldTemplateId\}, not \$\{world\.templateId\}`,\n"
              r"      \)\n"
              r"    \}"
          )
          replacement_guard = """    // A Blueprint with explicit semantic Embodiment is portable. Legacy\n    // Blueprints without Embodiment keep their original template restriction.\n    if (\n      blueprint.embodiment === undefined\n      && blueprint.worldTemplateId !== world.templateId\n      && world.templateId !== 'personal-world'\n    ) {\n      throw new PersistenceError(\n        `Blueprint ${blueprint.id}@${blueprint.version} belongs to ${blueprint.worldTemplateId}, not ${world.templateId}`,\n      )\n    }"""
          text, count = guard.subn(replacement_guard, text, count=1)
          if count != 1:
            raise SystemExit('recruit world compatibility guard not found')

          map_pattern = re.compile(r"function mapBlueprint\(row: object\): EmployeeBlueprint \{.*?\n\}\n\nfunction mapEmployee", re.S)
          match = map_pattern.search(text)
          if match is None:
            raise SystemExit('mapBlueprint block not found')
          replacement_map = """function mapBlueprint(row: object): EmployeeBlueprint {\n  const value = row as Record<string, unknown>\n  const blueprint: EmployeeBlueprint = {\n    schemaVersion: 1,\n    id: String(value.id),\n    version: Number(value.version),\n    worldTemplateId: String(value.world_template_id),\n    displayName: String(value.display_name),\n    role: String(value.role),\n    summary: String(value.summary),\n    persona: String(value.persona),\n    requestedSkills: parseJson<string[]>(value.requested_skills_json),\n    requestedCapabilities: parseJson<string[]>(value.requested_capabilities_json),\n    createdAt: String(value.created_at),\n  }\n  if (typeof value.embodiment_json === 'string') {\n    blueprint.embodiment = parseJson<NonNullable<EmployeeBlueprint['embodiment']>>(value.embodiment_json)\n  }\n  return blueprint\n}\n\nfunction mapEmployee"""
          text = text[:match.start()] + replacement_map + text[match.end():]

          equals_pattern = re.compile(r"function employeeBlueprintEquals\(left: EmployeeBlueprint, right: EmployeeBlueprint\): boolean \{.*?\n\}", re.S)
          match = equals_pattern.search(text)
          if match is None:
            raise SystemExit('employeeBlueprintEquals block not found')
          replacement_equals = """function employeeBlueprintEquals(left: EmployeeBlueprint, right: EmployeeBlueprint): boolean {\n  return left.schemaVersion === right.schemaVersion &&\n    left.id === right.id &&\n    left.version === right.version &&\n    left.worldTemplateId === right.worldTemplateId &&\n    left.displayName === right.displayName &&\n    left.role === right.role &&\n    left.summary === right.summary &&\n    left.persona === right.persona &&\n    left.createdAt === right.createdAt &&\n    [...left.requestedSkills].sort().join('\\u0000') === [...right.requestedSkills].sort().join('\\u0000') &&\n    [...left.requestedCapabilities].sort().join('\\u0000') === [...right.requestedCapabilities].sort().join('\\u0000') &&\n    JSON.stringify(left.embodiment ?? null) === JSON.stringify(right.embodiment ?? null)\n}"""
          text = text[:match.start()] + replacement_equals + text[match.end():]
          store.write_text(text, encoding='utf-8')

          tests = Path('packages/persistence/tests/sqlite-store.test.ts')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('schemaVersion: 12', 'schemaVersion: 13')
          text = text.replace('expect(exported.schemaVersion).toBe(12)', 'expect(exported.schemaVersion).toBe(13)')
          marker = """      DROP TABLE model_interaction_logs;\n      DELETE FROM schema_migrations WHERE version > 2;"""
          replacement = """      DROP TABLE model_interaction_logs;\n      ALTER TABLE employee_blueprints DROP COLUMN embodiment_json;\n      DELETE FROM schema_migrations WHERE version > 2;"""
          if marker not in text:
            raise SystemExit('legacy v2 fixture marker not found')
          tests.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f .github/workflows/validate-blueprint-embodiment.yml
          rm -f .github/workflows/apply-validated-blueprint-embodiment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/migrations.ts packages/persistence/src/sqlite-store.ts packages/persistence/tests/sqlite-store.test.ts .github/workflows
          git commit -m "refactor: persist portable Blueprint Embodiment"
          git push origin HEAD:feat/creative-world-platform-v1
