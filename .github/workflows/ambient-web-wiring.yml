name: Wire ambient life settings UI

on:
  push:
    branches:
      - feat/role-aware-ambient-life

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[ambient-web-wired]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/role-aware-ambient-life
          fetch-depth: 0
      - name: Patch world dock and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/web/src/features/world/WorldRuntimeDock.tsx')
          text = path.read_text()
          if 'PersonSimpleWalk,' not in text:
              text = text.replace('  Plus,\n', '  Plus,\n  PersonSimpleWalk,\n', 1)
          if "./AmbientLifeDialog.js" not in text:
              text = text.replace(
                  "import { WorldCanvas } from './WorldCanvas.js'\n",
                  "import { AmbientLifeDialog } from './AmbientLifeDialog.js'\n"
                  "import { WorldCanvas } from './WorldCanvas.js'\n",
                  1,
              )
          state_anchor = "  const [activeEmployeeId, setActiveEmployeeId] = useState<string | undefined>(selectedEmployeeId)\n"
          if 'ambientSettingsOpen' not in text:
              text = text.replace(
                  state_anchor,
                  state_anchor + "  const [ambientSettingsOpen, setAmbientSettingsOpen] = useState(false)\n",
                  1,
              )
          control_anchor = "          <button type=\"button\" className={runtime.snapshot.clock.lightsOn ? 'is-active' : ''} aria-label={runtime.snapshot.clock.lightsOn ? '关闭场景照明' : '打开场景照明'}"
          if 'aria-label="世界活力设置"' not in text:
              index = text.find(control_anchor)
              if index < 0:
                  raise SystemExit('Missing world controls anchor')
              button = "          <button type=\"button\" aria-label=\"世界活力设置\" title=\"配置角色有岗位逻辑的日常行为\" onClick={() => setAmbientSettingsOpen(true)}><PersonSimpleWalk size={16} /></button>\n"
              text = text[:index] + button + text[index:]
          dialog_anchor = "        {employees.length === 0 ? <div className=\"world-runtime-dock__empty\""
          if '<AmbientLifeDialog' not in text:
              index = text.find(dialog_anchor)
              if index < 0:
                  raise SystemExit('Missing world empty-state anchor')
              dialog = "        {ambientSettingsOpen ? <AmbientLifeDialog worldId={world.id} worldName={world.name} onClose={() => setAmbientSettingsOpen(false)} /> : null}\n\n"
              text = text[:index] + dialog + text[index:]
          path.write_text(text)

          css = Path('packages/web/src/styles.css')
          styles = css.read_text()
          marker = '/* role-aware ambient life */'
          if marker not in styles:
              styles += r'''

          /* role-aware ambient life */
          .ambient-life-backdrop { z-index: 180; }
          .ambient-life-dialog { width: min(760px, calc(100vw - 40px)); max-height: min(820px, calc(100vh - 40px)); overflow: auto; border: 1px solid var(--border-strong); border-radius: 18px; background: var(--surface-0); box-shadow: 0 28px 90px rgba(0,0,0,.5); }
          .ambient-life-dialog > header { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 14px; padding: 20px 22px; border-bottom: 1px solid var(--border-subtle); }
          .ambient-life-dialog > header h2 { margin: 0 0 5px; font-size: 20px; }
          .ambient-life-dialog > header p { margin: 0; color: var(--text-muted); line-height: 1.55; }
          .ambient-life-dialog__icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
          .ambient-life-dialog__body { display: grid; gap: 18px; padding: 22px; }
          .ambient-life-dialog__loading, .ambient-life-dialog__error { margin: 22px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); color: var(--text-muted); }
          .ambient-life-dialog__error { color: var(--danger); }
          .ambient-life-switch { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: 14px; background: var(--surface-1); }
          .ambient-life-switch span { display: grid; gap: 4px; }
          .ambient-life-switch small { color: var(--text-muted); line-height: 1.45; }
          .ambient-life-switch input { width: 42px; height: 24px; accent-color: var(--accent); }
          .ambient-life-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
          .ambient-life-field { display: grid; gap: 7px; }
          .ambient-life-field > span { color: var(--text-muted); font-size: 13px; }
          .ambient-life-field select { width: 100%; min-height: 42px; border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--surface-1); color: var(--text); padding: 0 12px; }
          .ambient-life-dialog__notice { display: grid; gap: 6px; padding: 14px 16px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface-1)); color: var(--text-muted); line-height: 1.55; }
          .ambient-life-dialog__notice strong { color: var(--text); }
          .ambient-life-dialog > footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; border-top: 1px solid var(--border-subtle); color: var(--text-muted); }
          .ambient-life-dialog > footer > div { display: flex; gap: 9px; }
          @media (max-width: 760px) { .ambient-life-grid { grid-template-columns: 1fr; } .ambient-life-dialog > footer { align-items: stretch; flex-direction: column; } }
          '''
              css.write_text(styles)
          PY
      - name: Commit web wiring
        run: |
          if git diff --quiet; then
            echo "Ambient settings UI already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/src/features/world/WorldRuntimeDock.tsx packages/web/src/styles.css
          git commit -m "feat: add per-world ambient life controls [ambient-web-wired]"
          git push origin HEAD:feat/role-aware-ambient-life
