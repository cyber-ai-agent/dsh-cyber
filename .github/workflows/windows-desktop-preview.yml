name: Windows desktop preview

on:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop-preview.yml'
      - 'apps/desktop/**'
      - 'packages/cli/**'
      - 'packages/server/**'
      - 'packages/web/**'
      - 'packages/harness-adapter/**'
      - 'packages/harness-bundle/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop-preview.yml'
      - 'apps/desktop/**'
      - 'packages/cli/**'
      - 'packages/server/**'
      - 'packages/web/**'
      - 'packages/harness-adapter/**'
      - 'packages/harness-bundle/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node apps/desktop/scripts/check-release-links.mjs
      - run: pnpm exec vitest run apps/desktop/tests/runtime.test.ts packages/cli/tests/cli.test.ts
      - run: pnpm --filter @dsh-cyber/desktop electron:check
      - run: pnpm --filter @dsh-cyber/desktop prepare:runtime
      - run: node apps/desktop/scripts/build-win.mjs dir
      - run: node apps/desktop/scripts/verify-artifact.mjs
