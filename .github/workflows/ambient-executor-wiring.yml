name: Wire ambient executor and runtime

on:
  push:
    branches:
      - feat/role-aware-ambient-life

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[ambient-executor-wired]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/role-aware-ambient-life
          fetch-depth: 0
      - name: Patch scheduler and server
        run: |
          python - <<'PY'
          from pathlib import Path

          scheduler = Path('packages/server/src/services/ambient-life-scheduler.ts')
          text = scheduler.read_text()
          text = text.replace(
              "import type { AmbientLifeTickResult, RoleAwareAmbientLifeService } from './role-aware-ambient-life-service.js'\n",
              "import type { AmbientWorldPolicy } from '@dsh-cyber/world-simulation'\n\n"
              "import type { AmbientLifeTickResult } from './role-aware-ambient-life-service.js'\n",
              1,
          )
          if 'export interface AmbientLifeTickPort' not in text:
              marker = 'export interface AmbientLifeSettingsReader {'
              interface = """export interface AmbientLifeTickPort {
                tick(worldId: string, policy?: Partial<AmbientWorldPolicy>): Promise<AmbientLifeTickResult>
              }

              """
              text = text.replace(marker, interface + marker, 1)
          text = text.replace('  service: RoleAwareAmbientLifeService\n', '  service: AmbientLifeTickPort\n')
          text = text.replace('  readonly #service: RoleAwareAmbientLifeService\n', '  readonly #service: AmbientLifeTickPort\n')
          scheduler.write_text(text)

          executor = Path('packages/server/src/services/ambient-life-executor.ts')
          text = executor.read_text()
          old = """        const next: CharacterPresence = {
                    ...presence,
                    reservedSlotId: undefined,
                    activePlanId: undefined,
                    physicalState: 'navigating',
                    updatedAt: nowIso,
                  }
          """
          new = """        const { reservedSlotId: _reservedSlotId, activePlanId: _activePlanId, ...rest } = presence
                  const next: CharacterPresence = {
                    ...rest,
                    physicalState: 'navigating',
                    updatedAt: nowIso,
                  }
          """
          if old in text:
              text = text.replace(old, new, 1)
          executor.write_text(text)

          server = Path('packages/server/src/server.ts')
          text = server.read_text()
          import_anchor = "import { AmbientLifeScheduler } from './services/ambient-life-scheduler.js'\n"
          if "./services/ambient-life-executor.js" not in text:
              text = text.replace(
                  import_anchor,
                  "import { AmbientLifeExecutor } from './services/ambient-life-executor.js'\n"
                  + import_anchor
                  + "import { AmbientLifeRuntime } from './services/ambient-life-runtime.js'\n",
                  1,
              )
          old_block = """  const ambientLife = new RoleAwareAmbientLifeService({
            stateProvider: ambientStateProvider,
            persistence: worldSimulation,
          })
          const ambientLifeScheduler = new AmbientLifeScheduler({
            settings: ambientLifeSettings,
            service: ambientLife,
            onResult: (result) => {
              if (result.plans.length > 0) worldRuntime.publishCurrent(result.worldId)
            },
          })
          """
          new_block = """  const ambientLife = new RoleAwareAmbientLifeService({
            stateProvider: ambientStateProvider,
            persistence: worldSimulation,
          })
          const ambientLifeExecutor = new AmbientLifeExecutor({ store, simulationStore: worldSimulation })
          const ambientLifeRuntime = new AmbientLifeRuntime({
            service: ambientLife,
            executor: ambientLifeExecutor,
            publish: (worldId) => worldRuntime.publishCurrent(worldId),
          })
          const ambientLifeScheduler = new AmbientLifeScheduler({
            settings: ambientLifeSettings,
            service: ambientLifeRuntime,
          })
          """
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif 'const ambientLifeRuntime = new AmbientLifeRuntime' not in text:
              raise SystemExit('Missing ambient runtime composition block')
          server.write_text(text)
          PY
      - name: Commit executor wiring
        run: |
          if git diff --quiet; then
            echo "Ambient executor already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server.ts packages/server/src/services/ambient-life-scheduler.ts packages/server/src/services/ambient-life-executor.ts
          git commit -m "feat: execute and complete ambient world plans [ambient-executor-wired]"
          git push origin HEAD:feat/role-aware-ambient-life
