name: Apply E2E contract refresh

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
      - name: Refresh E2E assertions for current information architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          workbench = Path('e2e/workbench.spec.ts')
          text = workbench.read_text(encoding='utf-8')
          old = """  await dock.getByRole('button', { name: '档案', exact: true }).click()\n  await dock.getByRole('button', { name: '全角色档案', exact: true }).click()\n  await expect(dock.getByText('全角色数字档案', { exact: true })).toBeVisible()"""
          new = """  await dock.getByRole('button', { name: '档案', exact: true }).click()\n  await expect(dock.getByText('全角色数字档案', { exact: true })).toBeVisible()"""
          if old not in text:
            raise SystemExit('workbench dossier assertion target not found')
          workbench.write_text(text.replace(old, new, 1), encoding='utf-8')

          stabilization = Path('e2e/world-experience-stabilization.spec.ts')
          text = stabilization.read_text(encoding='utf-8')
          old = "await expect(dialog.getByText(/当前世界已经有 1 名角色来自这份模板：管家/)).toBeVisible()"
          new = "await expect(dialog.getByText(/当前世界已有 1 名角色来自这份模板：管家/)).toBeVisible()"
          if old not in text:
            raise SystemExit('duplicate-role copy assertion target not found')
          stabilization.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-e2e-contract-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/workbench.spec.ts e2e/world-experience-stabilization.spec.ts .github/workflows/apply-e2e-contract-refresh.yml
          git commit -m "test: align full E2E with dossier information architecture"
          git push origin HEAD:feat/creative-world-platform-v1
