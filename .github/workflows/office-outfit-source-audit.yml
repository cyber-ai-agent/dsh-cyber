name: Office Outfit Build Audit

on:
  push:
    branches: [feat/official-office-outfits-v1]
    paths:
      - '.github/workflows/office-outfit-source-audit.yml'
      - 'scripts/official-avatar-office-outfit.mjs'
      - 'scripts/build-official-avatar-base-pack-resolved.mjs'
      - 'packages/web/scripts/verify-official-avatar-base-pack-runtime.mjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build official avatar pack with office outfit
        run: pnpm avatar:build-official
      - name: Verify generated VRM through production loader
        run: pnpm avatar:verify-official
      - name: Inspect generated manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile('marketplace/plugins/official-avatar-base-v1/avatar-base-pack.json', 'utf8'))
          if (manifest.version !== '1.1.0') throw new Error(`unexpected pack version ${manifest.version}`)
          for (const id of ['casual', 'professional', 'analyst']) {
            if (!manifest.parts.some((part) => part.kind === 'outfit' && part.id === id)) throw new Error(`missing outfit ${id}`)
          }
          if (manifest.parts.some((part) => part.kind === 'outfit' && part.id === 'engineer')) throw new Error('engineer must remain unsupported')
          console.log(JSON.stringify(manifest.parts.filter((part) => part.kind === 'outfit'), null, 2))
          NODE
