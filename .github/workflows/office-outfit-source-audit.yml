name: Office Outfit Source Audit

on:
  push:
    branches: [feat/official-office-outfits-v1]
    paths:
      - '.github/workflows/office-outfit-source-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect pinned modular Quaternius Business Man transport
        env:
          SOURCE_URL: https://media.githubusercontent.com/media/bbgott/mesh-mates/a9218da3a46bd0869a177f7378568bf947a8039c/packages/client/public/models/Business%20Man.glb
          EXPECTED_SHA256: c100d710169c2e7bcc7215cd5b3f8b4e649ebe76d651255c863d638a798ee6b3
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'

          function parseGlb(body) {
            const buffer = Buffer.from(body)
            if (buffer.length < 20 || buffer.readUInt32LE(0) !== 0x46546c67 || buffer.readUInt32LE(4) !== 2) throw new Error('not GLB2')
            let cursor = 12
            while (cursor + 8 <= buffer.length) {
              const len = buffer.readUInt32LE(cursor)
              const type = buffer.readUInt32LE(cursor + 4)
              const start = cursor + 8
              if (type === 0x4e4f534a) return JSON.parse(buffer.subarray(start, start + len).toString('utf8').trim())
              cursor = start + len
            }
            throw new Error('no JSON chunk')
          }

          const response = await fetch(process.env.SOURCE_URL)
          if (!response.ok) throw new Error(`download ${response.status}`)
          const sourceBytes = Buffer.from(await response.arrayBuffer())
          const sha256 = createHash('sha256').update(sourceBytes).digest('hex')
          if (sha256 !== process.env.EXPECTED_SHA256) throw new Error(`sha256 mismatch ${sha256}`)
          const source = parseGlb(sourceBytes)
          const base = parseGlb(await readFile('marketplace/plugins/official-avatar-base-v1/models/neutral.vrm'))
          const nodeName = (doc, index) => doc.nodes?.[index]?.name ?? `<node:${index}>`
          const sourceJointNames = [...new Set((source.skins ?? []).flatMap((skin) => (skin.joints ?? []).map((index) => nodeName(source, index))))]
          const baseNames = new Set((base.nodes ?? []).map((node) => node?.name).filter(Boolean))
          const meshNodes = (source.nodes ?? []).filter((node) => Number.isInteger(node?.mesh)).map((node) => ({ name: node.name, mesh: node.mesh, skin: node.skin, translation: node.translation, rotation: node.rotation, scale: node.scale }))
          const materialNames = (source.materials ?? []).map((material, index) => material?.name ?? `<material:${index}>`)
          const exactJointMatches = sourceJointNames.filter((name) => baseNames.has(name))
          const missingJointNames = sourceJointNames.filter((name) => !baseNames.has(name))

          console.log(`bytes=${sourceBytes.length}`)
          console.log(`sha256=${sha256}`)
          console.log(`nodes=${source.nodes?.length ?? 0} meshes=${source.meshes?.length ?? 0} skins=${source.skins?.length ?? 0} animations=${source.animations?.length ?? 0}`)
          console.log('meshNodes=' + JSON.stringify(meshNodes))
          console.log('materials=' + JSON.stringify(materialNames))
          console.log('sourceJointNames=' + JSON.stringify(sourceJointNames))
          console.log(`exactJointMatches=${exactJointMatches.length}/${sourceJointNames.length}: ` + JSON.stringify(exactJointMatches))
          console.log('missingJointNames=' + JSON.stringify(missingJointNames))
          console.log('baseRelevantNames=' + JSON.stringify([...baseNames].filter((name) => /root|hip|pelvis|spine|chest|neck|head|clav|arm|hand|index|thumb|middle|ring|pinky|thigh|leg|calf|foot|toe/i.test(name))))
          console.log('skins=' + JSON.stringify((source.skins ?? []).map((skin) => ({ skeleton: nodeName(source, skin.skeleton), joints: (skin.joints ?? []).map((index) => nodeName(source, index)), inverseBindMatrices: skin.inverseBindMatrices }))))
          console.log('images=' + JSON.stringify((source.images ?? []).map((image) => ({ uri: image.uri, mimeType: image.mimeType, bufferView: image.bufferView }))))
          console.log('textures=' + JSON.stringify(source.textures ?? []))
          NODE
