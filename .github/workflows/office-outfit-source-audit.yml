name: Office Outfit Source Audit

on:
  push:
    branches: [feat/official-office-outfits-v1]
    paths:
      - '.github/workflows/office-outfit-source-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect current official Base body partition
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          function parseGlb(body) {
            const buffer = Buffer.from(body)
            let cursor = 12
            while (cursor + 8 <= buffer.length) {
              const len = buffer.readUInt32LE(cursor)
              const type = buffer.readUInt32LE(cursor + 4)
              const start = cursor + 8
              if (type === 0x4e4f534a) return JSON.parse(buffer.subarray(start, start + len).toString('utf8').trim())
              cursor = start + len
            }
            throw new Error('no JSON chunk')
          }

          const base = parseGlb(await readFile('marketplace/plugins/official-avatar-base-v1/models/neutral.vrm'))
          const materials = (base.materials ?? []).map((material, index) => ({ index, name: material?.name, baseColorFactor: material?.pbrMetallicRoughness?.baseColorFactor }))
          const meshNodes = (base.nodes ?? []).filter((node) => Number.isInteger(node?.mesh)).map((node) => ({
            name: node.name,
            mesh: node.mesh,
            skin: node.skin,
            primitives: (base.meshes?.[node.mesh]?.primitives ?? []).map((primitive) => ({
              material: primitive.material,
              materialName: Number.isInteger(primitive.material) ? base.materials?.[primitive.material]?.name : undefined,
              attributes: Object.keys(primitive.attributes ?? {}),
            })),
          }))
          console.log('materials=' + JSON.stringify(materials))
          console.log('meshNodes=' + JSON.stringify(meshNodes))
          console.log('scenes=' + JSON.stringify(base.scenes ?? []))
          NODE
