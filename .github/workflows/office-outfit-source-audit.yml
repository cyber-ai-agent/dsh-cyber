name: Office Outfit Build Handoff

on:
  push:
    branches: [feat/official-office-outfits-v1]
    paths:
      - '.github/workflows/office-outfit-source-audit.yml'
      - 'scripts/official-avatar-office-outfit.mjs'
      - 'scripts/build-official-avatar-base-pack-resolved.mjs'
      - 'packages/web/scripts/verify-official-avatar-base-pack-runtime.mjs'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository == 'cyber-ai-agent/dsh-cyber' && github.ref_name == 'feat/official-office-outfits-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/official-office-outfits-v1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and production-verify official avatar pack
        run: pnpm avatar:build-official && pnpm avatar:verify-official
      - name: Commit verified generated pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add marketplace/plugins/official-avatar-base-v1
          if git diff --cached --quiet; then
            echo 'Generated pack already matches the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: embed verified office outfit avatar pack'
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD:feat/official-office-outfits-v1
