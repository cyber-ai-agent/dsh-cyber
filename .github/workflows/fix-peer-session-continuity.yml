name: Fix peer session continuity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feat/npc-collaboration-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/npc-collaboration-v1
          fetch-depth: 0
      - name: Refresh character state before each peer turn
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/orchestration/src/conversation-orchestrator.ts')
          text = path.read_text()
          if 'for (const scheduledEmployee of orderedEmployees)' not in text:
              start = text.index('      for (const employee of orderedEmployees) {', text.index('async peer('))
              end = text.index('      }\n    }\n    this.#store.appendDomainEvent({', start) + len('      }\n')
              replacement = """      for (const scheduledEmployee of orderedEmployees) {
        const employee = this.#requireEmployeeInWorld(
          scheduledEmployee.id,
          input.workspaceId,
          input.worldId,
        )
        replies.push(await this.#runAgent(
          session,
          employee,
          peerPrompt({
            basePrompt: input.runtimePrompt?.trim() || purpose,
            purpose,
            employee,
            initiator,
            participants: employees,
            replies,
            round,
            maxRounds,
          }),
          input.reasoningEffort,
        ))
      }
          """
              text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Peer session continuity already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orchestration/src/conversation-orchestrator.ts
          git commit -m "fix: reuse each character persistent Agent session across peer rounds [peer-session-continuity]"
          git push origin HEAD:feat/npc-collaboration-v1
