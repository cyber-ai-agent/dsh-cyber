name: Generate embodied runtime lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.head_ref == 'feat/embodied-world-runtime-v1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/embodied-world-runtime-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --lockfile-only --config.minimum-release-age=0
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh embodied runtime lockfile"
          git push origin HEAD:feat/embodied-world-runtime-v1
      - uses: actions/upload-artifact@v4
        with:
          name: embodied-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
