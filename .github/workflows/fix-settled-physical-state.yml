name: Fix settled embodied state

on:
  push:
    branches:
      - feat/embodied-world-runtime-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[settled-state-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/embodied-world-runtime-v1
          fetch-depth: 0
      - name: Apply settled physical-state mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/world-runtime/src/projector.ts')
          text = path.read_text()
          old = "      physicalState: activity === 'idle' ? 'at-home' : context.physicalState,"
          new = "      physicalState: settledPhysicalState(activity, context.physicalState),"
          if old not in text:
              raise SystemExit(0)
          text = text.replace(old, new, 1)
          marker = "function samePoint(left: WorldPoint, right: WorldPoint): boolean {"
          helper = """function settledPhysicalState(activity: WorldActivityKind, fallback: string): string {
            if (activity === 'idle') return 'at-home'
            if (activity === 'working') return 'working'
            if (activity === 'thinking') return 'thinking'
            if (activity === 'talking') return 'speaking'
            if (activity === 'meeting') return 'meeting'
            if (activity === 'blocked') return 'blocked'
            if (activity === 'celebrating') return 'celebrating'
            return fallback
          }

          """
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Settled state already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/world-runtime/src/projector.ts
          git commit -m "fix: settle in-place role actions correctly [settled-state-fixed]"
          git push origin HEAD:feat/embodied-world-runtime-v1
