name: Add world rollback domain event contract

on:
  push:
    branches: [feat/creative-world-platform-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/creative-world-platform-v1
      - name: Register world creation rollback audit event
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/contracts/src/index.ts')
          text = path.read_text(encoding='utf-8')
          old = "  'world.created',\n  'world.entered',"
          new = "  'world.created',\n  'world.creation.rolled-back',\n  'world.entered',"
          if old not in text:
            raise SystemExit('Domain event contract target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/add-world-rollback-domain-event.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts/src/index.ts .github/workflows/add-world-rollback-domain-event.yml
          git commit -m "feat: register world creation rollback domain event"
          git push origin HEAD:feat/creative-world-platform-v1
