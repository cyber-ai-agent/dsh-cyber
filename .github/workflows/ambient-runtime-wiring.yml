name: Wire ambient scheduler into server

on:
  push:
    branches:
      - feat/role-aware-ambient-life

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[ambient-runtime-wired]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/role-aware-ambient-life
          fetch-depth: 0
      - name: Patch runtime composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/server/src/server.ts')
          text = path.read_text()
          imports = [
              ("import { AmbientLifeSettingsService } from './services/ambient-life-settings-service.js'\n",
               "import { AmbientLifeScheduler } from './services/ambient-life-scheduler.js'\n"
               "import { AmbientLifeSettingsService } from './services/ambient-life-settings-service.js'\n"),
              ("import { WorldAccessService } from './services/world-access-service.js'\n",
               "import { RoleAwareAmbientLifeService } from './services/role-aware-ambient-life-service.js'\n"
               "import { WorldAccessService } from './services/world-access-service.js'\n"
               "import { WorldAmbientSlotResolver } from './services/world-ambient-slot-resolver.js'\n"
               "import { WorldAmbientStateProvider } from './services/world-ambient-state-provider.js'\n"),
          ]
          for old, new in imports:
              if new.splitlines()[0] not in text:
                  if old not in text:
                      raise SystemExit(f'Missing import anchor: {old}')
                  text = text.replace(old, new, 1)

          marker = "  const runtimeUpdates = new RuntimeUpdateService(store, stateRoot, workspaceRoot)\n"
          if 'const ambientLifeScheduler = new AmbientLifeScheduler' not in text:
              if marker not in text:
                  raise SystemExit('Missing ambient runtime insertion anchor')
              block = """  const ambientSlotResolver = new WorldAmbientSlotResolver({ store })
          const ambientStateProvider = new WorldAmbientStateProvider({
            store,
            simulationStore: worldSimulation,
            resolveSlots: (worldId) => ambientSlotResolver.resolve(worldId),
          })
          const ambientLife = new RoleAwareAmbientLifeService({
            stateProvider: ambientStateProvider,
            persistence: worldSimulation,
          })
          const ambientLifeScheduler = new AmbientLifeScheduler({
            settings: ambientLifeSettings,
            service: ambientLife,
            onResult: (result) => {
              if (result.plans.length > 0) worldRuntime.publishCurrent(result.worldId)
            },
          })
          """
              text = text.replace(marker, block + marker, 1)

          start_anchor = "    async start() {\n      if (closed) throw new Error('Server is closed')\n"
          if 'ambientLifeScheduler.start()' not in text:
              if start_anchor not in text:
                  raise SystemExit('Missing server start anchor')
              text = text.replace(
                  start_anchor,
                  start_anchor + "      ambientLifeScheduler.start()\n",
                  1,
              )

          close_anchor = "    async close() {\n"
          if 'await ambientLifeScheduler.close()' not in text:
              if close_anchor not in text:
                  raise SystemExit('Missing server close anchor')
              text = text.replace(
                  close_anchor,
                  close_anchor + "      await ambientLifeScheduler.close()\n",
                  1,
              )

          path.write_text(text)
          PY
      - name: Commit runtime wiring
        run: |
          if git diff --quiet; then
            echo "Ambient scheduler already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server.ts
          git commit -m "feat: schedule role-aware ambient world ticks [ambient-runtime-wired]"
          git push origin HEAD:feat/role-aware-ambient-life
