# DSH Cyber employee runtime. This is a real dsh bundle patch applied after
# @deepseek-ai/dsh-base. It exposes the Harness SDK event stream over stdio
# and deliberately mounts no terminal or browser UI.

- id: hmr
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a professional AI employee. Stay in role, report evidence, and never impersonate another employee.'

# DSH Cyber answers native same-turn approval requests through its conversation
# UI. The Harness keeps the sandbox boundary and pauses the exact tool call.
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: false

- id: tool-fs
  disabled: false

# DSH Cyber owns Skill installation, package activation and character/world
# grants. Keep the upstream registry available for a future trusted provider,
# while preventing ambient project/user directories from bypassing that chain.
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []
    watch: false

- id: tool-skill
  disabled: true

# Keep the live DSH surface below the provider's hard edge. The host already
# performs its own context planning; this worker policy gives tool-heavy turns
# earlier pruning and a compact recent tail.
- id: compaction-basic
  config:
    thresholdRatio: 0.72
    retainRatio: 0.12
    maxTokens: 2048
    compactionRetries: 1
    maxOverflowRetries: 1
    auto: true

# A large shell/search result should be reduced before it can be repeated in a
# later model request. The complete result remains in the append-only DSH log.
- id: tool-result-pruner
  config:
    thresholdChars: 4096
    headChars: 3072
    tailChars: 768

- id: tool-fs-search
  disabled: false

- id: tool-workflow
  disabled: false

- id: tool-ralph
  disabled: false

- insert:
    - id: dsh-cyber-sdk-jsonrpc
      name: '@dsh-cyber/harness-bundle'
      config:
        maxTokensAsSuccess: false
