# DSH Cyber employee runtime. This is a real dsh bundle patch applied after
# @deepseek-ai/dsh-base. It exposes the Harness SDK event stream over stdio
# and deliberately mounts no terminal or browser UI.

- id: hmr
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-title-llm
  disabled: true

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a professional AI employee. Stay in role, report evidence, and never impersonate another employee.'

# SDK workers have no in-turn approval UI. The product requires a separate,
# explicit high-risk confirmation before selecting danger-full-access.
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    presets:
      read-only:
        sandbox: read-only
        approval: never
      workspace-write:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: tool-bash
  disabled: !!js process.env.DSH_PERMISSION_MODE === 'read-only'

- id: tool-pwsh
  disabled: !!js process.env.DSH_PERMISSION_MODE === 'read-only'

- id: tool-str-replace-editor
  disabled: !!js process.env.DSH_PERMISSION_MODE === 'read-only'

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

- id: tool-workflow
  disabled: !!js process.env.DSH_PERMISSION_MODE === 'read-only'

- id: tool-ralph
  disabled: !!js process.env.DSH_PERMISSION_MODE === 'read-only'

- insert:
    - id: dsh-cyber-sdk-jsonrpc
      name: '@dsh-cyber/harness-bundle'
      config:
        maxTokensAsSuccess: false
