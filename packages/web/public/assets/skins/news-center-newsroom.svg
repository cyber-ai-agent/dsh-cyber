    <path d="M110 508 -60 1024M420 508 340 1024M768 508 768 1024M1116 508 1196 1024M1426 508 1596 1024"/>
  </g>

  <!-- world clocks strip: the newsroom's constant reminder that intelligence is dated -->
  <g>
