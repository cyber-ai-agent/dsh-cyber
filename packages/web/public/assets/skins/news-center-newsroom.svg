<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="新闻中心 · 编辑部">
  <title>新闻中心 · 编辑部</title>
  <desc>程序化绘制的 2D 新闻编辑部场景：编辑部大屏、播报主台、追踪线板、信息源采集台、事实核实台、图表工作台、时间线墙、简报归档架与编前会桌。</desc>
  <defs>
    <linearGradient id="nc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c38"/>
      <stop offset="1" stop-color="#18202a"/>
    </linearGradient>
    <linearGradient id="nc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/>
      <stop offset="1" stop-color="#1b222b"/>
    </linearGradient>
    <linearGradient id="nc-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2b33"/>
      <stop offset="1" stop-color="#08171d"/>
    </linearGradient>
    <linearGradient id="nc-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5666"/>
      <stop offset="1" stop-color="#333d4a"/>
    </linearGradient>
    <linearGradient id="nc-panel" x1="0" y1="0" x2="0" y2="1">
