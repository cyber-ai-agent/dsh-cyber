    <linearGradient id="nc-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a58"/>
      <stop offset="1" stop-color="#1d2f3a"/>
    </linearGradient>
  </defs>

  <!-- room shell -->
