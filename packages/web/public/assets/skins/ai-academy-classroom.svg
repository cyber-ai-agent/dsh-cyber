<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="AI 学院 · 大学教室">
  <title>AI 学院 · 大学教室</title>
  <desc>程序化绘制的 2D 大学教室场景：黑板、讲台、学员席、知识拆解台、教材工作台、答疑席、知识图谱墙与课程成果展台。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dc"/>
      <stop offset="1" stop-color="#ddd3c1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b79a74"/>
      <stop offset="1" stop-color="#8d7150"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a42"/>
      <stop offset="1" stop-color="#1e352f"/>
