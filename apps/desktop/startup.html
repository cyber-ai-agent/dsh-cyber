<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在启动 DSH Cyber</title>
  <style>
    :root { font-family: 'Noto Sans SC', 'Microsoft YaHei UI', 'Segoe UI', sans-serif; color-scheme: dark; color: #f8fafc; background: #090d13; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 32px; }
    main { width: min(100%, 420px); display: grid; justify-items: start; gap: 14px; }
    img { width: 64px; height: 64px; object-fit: contain; }
    h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.3; letter-spacing: -0.02em; }
    p { margin: 0; color: #cbd5e1; font-size: 14px; line-height: 1.7; }
    .progress { width: 100%; height: 3px; margin-top: 16px; overflow: hidden; background: #233140; }
    .progress::after { content: ''; display: block; width: 28%; height: 100%; background: #00e5ff; animation: travel 1.5s ease-in-out infinite alternate; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <main aria-live="polite">
    <img src="favicon.png" alt="">
    <h1>正在准备本地工作台</h1>
    <p>首次启动或版本升级时，会先验证并备份已有资料。较大的资料库可能需要一些时间。</p>
    <div class="progress" role="progressbar" aria-label="正在启动" aria-valuetext="正在准备本地服务"></div>
  </main>
</body>
</html>
